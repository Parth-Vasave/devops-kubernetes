name: Release log output

on:
  push:
    branches:
      - main
    paths:
      - "log-output/**"
      - "!log-output/**/*.md"
      - ".github/workflows/log-output.yaml"

# Releases run one at a time so their image tag commits cannot conflict
concurrency:
  group: log-output-release

env:
  REGISTRY: asia-south1-docker.pkg.dev/devops-kubernetes-508609/exercises

jobs:
  build-publish-release:
    name: Build, publish and release
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the commit that updates the image tag
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/418821991749/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-actions-deployer@devops-kubernetes-508609.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and publish image
        run: |
          docker build --tag "$REGISTRY/log-output:$GITHUB_SHA" log-output
          docker push "$REGISTRY/log-output:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # The cluster is not touched here: Argo CD notices the new image tag in Git and deploys it
      - name: Update the image tag in Git
        run: |
          cd log-output/manifests
          kustomize edit set image "parthvasave/log-output=$REGISTRY/log-output:$GITHUB_SHA"
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-output/manifests/kustomization.yaml
          git commit --message "Release log-output ${GITHUB_SHA::7}"
          # Commits pushed with GITHUB_TOKEN do not start new workflow runs, so this cannot loop
          git pull --rebase
          git push
