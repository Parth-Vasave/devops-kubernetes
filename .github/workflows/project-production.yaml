name: Release project to production

# Every tag is a production release
on:
  push:
    tags:
      - "*"

concurrency:
  group: project-release-production

env:
  REGISTRY: asia-south1-docker.pkg.dev/devops-kubernetes-508609/project

jobs:
  build-publish-release:
    name: Build, publish and release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/418821991749/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-actions-deployer@devops-kubernetes-508609.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Images are built from the tagged commit and tagged with its SHA, so production runs exactly what was tagged
      - name: Build and publish images
        run: |
          for app in todo-app todo-backend broadcaster; do
            docker build --tag "$REGISTRY/$app:$GITHUB_SHA" "$app"
            docker push "$REGISTRY/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # The configuration lives in its own repository; the deploy key can only write to that repository
      - name: Checkout the configuration repository
        uses: actions/checkout@v7
        with:
          repository: Parth-Vasave/dwk-project-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config

      # Argo CD deploys production from the configuration repository, so the new image tags are committed there
      - name: Update the production image tags
        working-directory: config
        run: |
          cd project/overlays/production
          kustomize edit set image \
            "parthvasave/todo-app=$REGISTRY/todo-app:$GITHUB_SHA" \
            "parthvasave/todo-backend=$REGISTRY/todo-backend:$GITHUB_SHA" \
            "parthvasave/broadcaster=$REGISTRY/broadcaster:$GITHUB_SHA"
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production already runs ${GITHUB_SHA::7}"
            exit 0
          fi
          git commit --message "Release ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) to production" --message "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          git pull --rebase
          git push
