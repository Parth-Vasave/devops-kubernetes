name: Deploy branch environment

# main (staging) and tags (production) are deployed by Argo CD; every other branch gets its own environment from this workflow
on:
  push:
    branches:
      - "**"
      - "!main"

# Deploys of the same branch run one at a time so they cannot overwrite each other
concurrency:
  group: deploy-${{ github.ref_name }}

env:
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: asia-south1-a
  REGISTRY: asia-south1-docker.pkg.dev/devops-kubernetes-508609/project
  SOPS_VERSION: v3.13.3

jobs:
  build-publish-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the configuration repository
        uses: actions/checkout@v7
        with:
          repository: Parth-Vasave/dwk-project-config
          path: config

      # Each branch is deployed to a namespace named after the branch
      - name: Choose namespace
        run: |
          if [ "$GITHUB_REF_NAME" = "staging" ] || [ "$GITHUB_REF_NAME" = "production" ]; then
            echo "A branch named $GITHUB_REF_NAME would overwrite an environment Argo CD manages"
            exit 1
          fi
          echo "NAMESPACE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      # Workload Identity Federation: GitHub's OIDC token is exchanged for short-lived Google credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/418821991749/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-actions-deployer@devops-kubernetes-508609.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Build and publish images
        run: |
          for app in todo-app todo-backend broadcaster; do
            docker build --tag "$REGISTRY/$app:$GITHUB_SHA" "$app"
            docker push "$REGISTRY/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Set up SOPS
        run: |
          # GitHub release downloads sometimes fail with a 504, so retry them
          curl -sSfLO --retry 5 --retry-all-errors "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          curl -sSfLO --retry 5 --retry-all-errors "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.checksums.txt"
          sha256sum --check --ignore-missing "sops-$SOPS_VERSION.checksums.txt"
          sudo install -m 0755 "sops-$SOPS_VERSION.linux.amd64" /usr/local/bin/sops

      - name: Deploy
        working-directory: config/project/base
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # The decrypted secret only exists on the runner; adding it to the kustomization puts it in the target namespace
          sops --decrypt ../../todo-backend/manifests/secret.enc.yaml > secret.yaml
          kustomize edit add resource secret.yaml
          # The base has no backup and no Discord secret, so branch environments are not backed up and their broadcasters just log
          kustomize edit set namespace "$NAMESPACE"
          kustomize edit set image \
            "parthvasave/todo-app=$REGISTRY/todo-app:$GITHUB_SHA" \
            "parthvasave/todo-backend=$REGISTRY/todo-backend:$GITHUB_SHA" \
            "parthvasave/broadcaster=$REGISTRY/broadcaster:$GITHUB_SHA"
          kustomize build . | kubectl apply -f -
          # Branch environments are labeled so the delete workflow only removes namespaces this pipeline created
          kubectl label namespace "$NAMESPACE" project-environment=branch --overwrite
          kubectl -n "$NAMESPACE" rollout status deployment/todo-backend --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/todo-app --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/nats --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/broadcaster --timeout=300s
          kubectl -n "$NAMESPACE" get gateway todo-gateway
