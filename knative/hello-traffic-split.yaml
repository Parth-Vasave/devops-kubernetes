# Traffic splitting: https://knative.dev/docs/getting-started/first-traffic-split/
# Changing TARGET creates a new revision (hello-00002); traffic is split 50/50 with the first revision
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: default
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative"
  traffic:
    - latestRevision: true
      percent: 50
    - revisionName: hello-00001
      percent: 50
