# Argo CD keeps the staging namespace in sync with project/overlays/staging on the main branch
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Parth-Vasave/devops-kubernetes
    targetRevision: main
    path: project/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    # Apply every new commit automatically, delete resources removed from Git and undo manual changes in the cluster
    automated:
      prune: true
      selfHeal: true
