apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging: deployed by Argo CD from every commit to main (see ../../argocd/staging.yaml)
namespace: staging
resources:
- ../../base
# Only the database secret: without the Discord webhook the broadcaster just logs the messages.
# The backup CronJob is not included, so the staging database is not backed up.
generators:
- secret-generator.yaml
  # Staging does not need production's 6 broadcaster replicas
patches:
  # Shows a "staging environment" banner in the todo app
  - target:
      kind: Deployment
      name: todo-app
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: staging
- patch: |
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: broadcaster
# The staging release workflow sets the images built from the latest commit to main
images:
- name: parthvasave/broadcaster
  newName: asia-south1-docker.pkg.dev/devops-kubernetes-508609/project/broadcaster
  newTag: 02bd87c7804b414da83c8543805b6ea54645a93a
- name: parthvasave/todo-app
  newName: asia-south1-docker.pkg.dev/devops-kubernetes-508609/project/todo-app
  newTag: 02bd87c7804b414da83c8543805b6ea54645a93a
- name: parthvasave/todo-backend
  newName: asia-south1-docker.pkg.dev/devops-kubernetes-508609/project/todo-backend
  newTag: 02bd87c7804b414da83c8543805b6ea54645a93a
