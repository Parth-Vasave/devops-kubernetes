apiVersion: v1
kind: ConfigMap
metadata:
  name: log-output-config
  namespace: exercises
data:
  information.txt: |
    this text is from file
  MESSAGE: "hello world"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: generator
          image: parthvasave/log-output:5.3
          command: ["node", "generator.js"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared-data
        - name: log-output
          image: parthvasave/log-output:5.3
          env:
            - name: PORT
              value: "3000"
            - name: MESSAGE
              valueFrom: { configMapKeyRef: { name: log-output-config, key: MESSAGE } }
            # The Knative service's fully qualified name; it points to Kourier, which wakes up Ping-pong if needed
            - name: PING_PONG_URL
              value: http://pingpong.exercises.svc.cluster.local/pings
          ports:
            - containerPort: 3000
          # /readyz calls Ping-pong, which would keep the serverless Ping-pong from ever scaling to zero,
          # so readiness only checks that the server accepts connections
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: shared-data
              mountPath: /shared-data
            - name: config
              mountPath: /etc/config
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: config
          configMap:
            name: log-output-config
---
# The cluster maps localhost:8082 to NodePort 30080 on agent-0
apiVersion: v1
kind: Service
metadata:
  name: log-output
  namespace: exercises
spec:
  type: NodePort
  selector:
    app: log-output
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
