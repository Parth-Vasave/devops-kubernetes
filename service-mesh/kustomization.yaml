apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Log output, Ping-pong and the greeter in the Istio ambient mesh (Exercise 5.3).
# The database secret is applied separately: sops --decrypt ../ping-pong/manifests/secret.enc.yaml | kubectl apply -f -
resources:
  - namespace.yaml
  - waypoint.yaml
  - postgres.yaml
  - pingpong.yaml
  - log-output.yaml
  - greeter.yaml
  - gateway.yaml
