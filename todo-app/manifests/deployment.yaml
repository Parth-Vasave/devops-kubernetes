apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: parthvasave/todo-app
          env:
            - name: PORT
              value: "3000"
            - name: TODO_BACKEND_URL
              value: "http://todo-backend:3000"
            - name: IMAGE_URL
              value: "https://picsum.photos/1200"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: todo-data
              mountPath: /app/files
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: todo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: project
spec:
  selector:
    app: todo-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
