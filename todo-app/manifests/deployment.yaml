apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  # todo-pvc is ReadWriteOnce, so the old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: parthvasave/todo-app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          env:
            - name: PORT
              value: "3000"
            - name: TODO_BACKEND_URL
              value: "http://todo-backend:3000"
            - name: IMAGE_URL
              value: "https://picsum.photos/1200"
          ports:
            - containerPort: 3000
          # Ready only when the app is healthy and the backend is connected to the database
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # Restarted soon after the app is broken with the "break the app" button
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: todo-data
              mountPath: /app/files
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: todo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: project
spec:
  selector:
    app: todo-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
