apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
  namespace: project
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: todo-backup
          restartPolicy: Never
          initContainers:
            # pg_dump must be at least the server's major version, so use the same image as the database
            - name: dump
              image: postgres:17
              envFrom:
                - configMapRef:
                    name: todo-backend-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE="backup-$(date +%Y-%m-%d-%H%M%S).sql"
                  pg_dump --file "/backup/$FILE"
                  echo "$FILE" > /backup/filename
                  echo "Dumped $PGDATABASE to $FILE ($(wc -c < "/backup/$FILE") bytes)"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-alpine
              env:
                - name: BUCKET
                  value: devops-kubernetes-508609-todo-backups
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE="$(cat /backup/filename)"
                  gcloud storage cp "/backup/$FILE" "gs://$BUCKET/$FILE"
                  echo "Uploaded gs://$BUCKET/$FILE"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
