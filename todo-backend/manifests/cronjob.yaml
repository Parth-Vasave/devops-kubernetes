apiVersion: batch/v1
kind: CronJob
metadata:
  name: random-wiki-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: random-wiki-todo
              image: curlimages/curl:8.22.0
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              env:
                - name: RANDOM_ARTICLE_URL
                  value: "https://en.wikipedia.org/wiki/Special:Random"
                - name: TODO_BACKEND_URL
                  value: "http://todo-backend:3000"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Try a few random articles in case the backend rejects one (e.g. too long)
                  for attempt in 1 2 3 4 5; do
                    ARTICLE_URL=$(curl -s -o /dev/null -w '%{redirect_url}' "$RANDOM_ARTICLE_URL")
                    if [ -n "$ARTICLE_URL" ] && curl -sf -X POST \
                        -H "Content-Type: application/json" \
                        -d "{\"content\": \"Read $ARTICLE_URL\"}" \
                        "$TODO_BACKEND_URL/todos"; then
                      echo
                      echo "Created todo: Read $ARTICLE_URL"
                      exit 0
                    fi
                    echo "Could not create todo for '$ARTICLE_URL' (attempt $attempt)"
                  done
                  exit 1
