apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      initContainers:
        # Runs once before the other containers start: the first page is the Kubernetes article
        - name: fetch-kubernetes-page
          image: curlimages/curl:8.16.0
          command: ["curl"]
          args:
            - --fail
            - --silent
            - --show-error
            - --location
            - --user-agent
            - dwk-wikipedia-exercise/1.0
            - --output
            - /www/index.html
            - https://en.wikipedia.org/wiki/Kubernetes
          volumeMounts:
            - name: www
              mountPath: /www
        # restartPolicy: Always makes this a native sidecar: it starts before nginx and keeps running next to it
        - name: random-page-updater
          image: curlimages/curl:8.16.0
          restartPolicy: Always
          env:
            # Seconds to wait before each new random page (5 to 15 minutes)
            - name: MIN_WAIT_SECONDS
              value: "300"
            - name: MAX_WAIT_SECONDS
              value: "900"
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                wait=$(shuf -i "$MIN_WAIT_SECONDS-$MAX_WAIT_SECONDS" -n 1)
                echo "Waiting $wait seconds before fetching a random page"
                sleep "$wait"
                # Download to a temporary file first so nginx never serves a partly written page
                if curl --fail --silent --show-error --location --user-agent dwk-wikipedia-exercise/1.0 \
                    --output /www/index.html.tmp --write-out '%{url_effective}\n' \
                    https://en.wikipedia.org/wiki/Special:Random; then
                  mv /www/index.html.tmp /www/index.html
                else
                  echo "Fetching a random page failed, keeping the current page"
                fi
              done
          volumeMounts:
            - name: www
              mountPath: /www
      containers:
        # Serves whatever is in its public www directory
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia
  namespace: default
spec:
  selector:
    app: wikipedia
  ports:
    - port: 80
      targetPort: 80
